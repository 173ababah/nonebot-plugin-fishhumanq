[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "nonebot-plugin-fishhumanq"
version = "0.1.0"
description = "回复去 AI 腔质量层（从 astrbot 版转写）：固定规则进 system prompt，重复开头与套话进下一轮提醒，按人格适配"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "173ababah" }]
requires-python = ">=3.9"
dependencies = ["nonebot2>=2.0.0", "nonebot-adapter-onebot>=2.2.0", "pydantic>=2.0"]

[project.urls]
Homepage = "https://github.com/173ababah/nonebot-plugin-fishhumanq"
Repository = "https://github.com/173ababah/nonebot-plugin-fishhumanq"

[tool.nonebot]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
plugin_name = "nonebot-plugin-fishhumanq"
plugins = ["nonebot_plugin_fishhumanq"]

[tool.pdm.build]
includes = ["nonebot_plugin_fishhumanq"]
